worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Client IP for the API's rate limiter and audit log.
    real_ip_header X-Forwarded-For;

    log_format main '$remote_addr - $status "$request_method $uri" '
                    'rt=$request_time rid=$http_x_request_id';
    access_log /var/log/nginx/access.log main;

    # X-ray uploads are capped at 20 MB (Section 5).
    client_max_body_size 21m;

    # Abuse limits at the edge, in addition to the per-user limits in the API.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    upstream api_upstream      { server api:4000; }
    upstream web_upstream      { server web:8080; }

    # Plain HTTP exists only to redirect to TLS.
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Login and MFA are rate-limited harder than the rest of the API.
        location ~ ^/api/v1/auth/(login|mfa) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api_upstream;
            include /etc/nginx/proxy_common.conf;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api_upstream;
            include /etc/nginx/proxy_common.conf;
        }

        # Socket.IO needs the upgrade handshake and a long read timeout.
        location /socket.io/ {
            proxy_pass http://api_upstream;
            include /etc/nginx/proxy_common.conf;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://web_upstream;
            include /etc/nginx/proxy_common.conf;
        }

        # The inference service is deliberately NOT routed here. It is reachable
        # only on the internal Docker network, over HMAC-signed calls from the API.
    }
}
