proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id      $http_x_request_id;
# Timeouts are set once at http level in nginx.conf: a location that includes
# this file may then override them (Socket.IO does). Setting them here made
# the Socket.IO location's override a duplicate directive, and nginx refused
# to start.
