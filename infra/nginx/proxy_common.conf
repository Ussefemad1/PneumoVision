proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id      $http_x_request_id;
proxy_connect_timeout 10s;
proxy_send_timeout    120s;
# proxy_read_timeout is set per location in nginx.conf, after this include:
# /socket.io/ needs 3600s, and nginx refuses a directive repeated in one
# location (it exited on start with "proxy_read_timeout is duplicate").
