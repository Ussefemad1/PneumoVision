# Static file server for the built SPA. Sits behind the edge proxy, so TLS and
# the security headers are applied there, not here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable; the entry HTML never is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: unknown paths resolve to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
