version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: pip
    directory: /services/inference
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The training environment is version-pinned deliberately (Python 3.11,
  # torch 2.4.1). Updates here are reviewed manually, never auto-merged.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
