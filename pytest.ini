[pytest]
testpaths = tests
# Repo root on sys.path for collection, so `from tools...` works whether pytest
# is started as `pytest` (console script: does not add the cwd) or
# `python -m pytest` (does), from any OS.
pythonpath = .
addopts = -q -m "not round2 and not round2b and not round2b_cache"
markers =
    round2: Round 2 acceptance checks on saved runs (python -m pytest -m round2 -s)
    round2b: Round 2b calibration checks on saved runs; trains briefly (python -m pytest -m round2b -s)
    round2b_cache: --cache_frozen_logits equivalence on virtual data; trains (Colab: python -m pytest -m round2b_cache -s)
filterwarnings =
    ignore::DeprecationWarning
