[pytest]
testpaths = tests
# Repo root on sys.path for collection, so `from tools...` works whether pytest
# is started as `pytest` (console script: does not add the cwd) or
# `python -m pytest` (does), from any OS.
pythonpath = .
addopts = -q -m "not round2"
markers =
    round2: Round 2 acceptance checks on saved runs (python -m pytest -m round2 -s)
filterwarnings =
    ignore::DeprecationWarning
